name: Isolated battle load diagnostics
on:
  push:
    paths:
      - 'qa/mass-battle-process-load.cjs'
      - '.github/workflows/battle-process-load.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-load:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install server dependency only
        run: npm ci --omit=dev --ignore-scripts
      - name: Exercise isolated server with four client workers
        run: node qa/mass-battle-process-load.cjs 60 process-load.json 4
      - name: Retain measurements and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-load-${{ matrix.os }}
          path: process-load.json
          if-no-files-found: warn
          retention-days: 14
